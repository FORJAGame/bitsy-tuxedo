name: release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-prod
  cancel-in-progress: true

env:
  # Document Root do subdomínio tuxedo.forjagame.com.
  REMOTE_DIR: ~/public_html/tuxedo

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4

      # ---------- build ----------
      - name: Gerar ícones
        run: node ./dev/icon_generator/makeicons

      - name: Empacotar recursos
        run: node ./dev/resource_packager

      - name: Versão
        id: version
        run: |
          MAJOR=$(grep -oP '(?<=major: )\d+' ./editor/script/engine/bitsy.js)
          MINOR=$(grep -oP '(?<=minor: )\d+' ./editor/script/engine/bitsy.js)
          echo "current-version=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Verificar artefatos do build
        run: |
          test -f editor/index.html || (echo "editor/index.html não encontrado" && exit 1)
          test -f editor/script/generated/resources.js || (echo "resources.js não foi gerado" && exit 1)
          echo "Build OK — versão ${{ steps.version.outputs.current-version }}"

      # ---------- deploy ----------
      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Testar conexão
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/id_deploy -o BatchMode=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "echo 'SSH OK'; ls -d ${{ env.REMOTE_DIR }} || echo 'ATENÇÃO: REMOTE_DIR não existe'"

      # Rode uma vez com este step habilitado antes de valer de verdade.
      # Ele lista o que seria enviado e apagado, sem alterar nada.
      - name: Dry run
        run: |
          rsync -avz --delete --dry-run \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_deploy -o BatchMode=yes" \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            --exclude='.htaccess' \
            ./editor/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_DIR }}/"

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/id_deploy -o BatchMode=yes" \
            --exclude='.well-known/' \
            --exclude='cgi-bin/' \
            --exclude='.htaccess' \
            ./editor/ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.REMOTE_DIR }}/"