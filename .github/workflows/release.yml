name: release

# Deploy via SFTP com lftp

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-prod
  cancel-in-progress: true

env:
  REMOTE_DIR: public_html/tuxedo

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4

      # ---------- build ----------
      - name: Gerar ícones
        run: node ./dev/icon_generator/makeicons

      - name: Empacotar recursos
        run: node ./dev/resource_packager

      - name: Versão
        id: version
        run: |
          MAJOR=$(grep -oP '(?<=major: )\d+' ./editor/script/engine/bitsy.js)
          MINOR=$(grep -oP '(?<=minor: )\d+' ./editor/script/engine/bitsy.js)
          echo "current-version=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Verificar artefatos do build
        run: |
          test -f editor/index.html || (echo "editor/index.html não encontrado" && exit 1)
          test -f editor/script/generated/resources.js || (echo "resources.js não foi gerado" && exit 1)
          echo "Build OK — versão ${{ steps.version.outputs.current-version }}"

      # ---------- deploy ----------
      - name: Instalar lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Teste
      - name: Dry run
        run: |
          KEY="$HOME/.ssh/id_deploy"
          lftp -c "
            set sftp:connect-program 'ssh -a -x -p ${{ secrets.SSH_PORT }} -o BatchMode=yes -i $KEY';
            open -u ${{ secrets.SSH_USER }}, sftp://${{ secrets.SSH_HOST }};
            mirror --reverse --delete --dry-run --verbose --no-perms \
                   --exclude-glob .well-known/ \
                   --exclude-glob cgi-bin/ \
                   --exclude-glob .htaccess \
                   ./editor/ ${{ env.REMOTE_DIR }};
          "

      - name: Deploy via SFTP
        run: |
          KEY="$HOME/.ssh/id_deploy"
          lftp -c "
            set sftp:connect-program 'ssh -a -x -p ${{ secrets.SSH_PORT }} -o BatchMode=yes -i $KEY';
            set net:max-retries 2;
            set net:timeout 20;
            open -u ${{ secrets.SSH_USER }}, sftp://${{ secrets.SSH_HOST }};
            mirror --reverse --delete --verbose --parallel=4 --no-perms \
                   --exclude-glob .well-known/ \
                   --exclude-glob cgi-bin/ \
                   --exclude-glob .htaccess \
                   ./editor/ ${{ env.REMOTE_DIR }};
          "